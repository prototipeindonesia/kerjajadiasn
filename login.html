<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <a href="index.html" class="flex justify-center mb-6 text-2xl font-extrabold text-blue-600">
      KERJA JADI <span class="text-yellow-500">ASN</span>
    </a>
    <div class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-2 text-center">Masuk Peserta</h1>
      <p class="text-slate-500 text-center mb-8 text-sm">Masukkan kode akses yang Anda terima dari Admin</p>

      <form id="formLogin" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">Kode Akses</label>
          <input required id="kodeInput" type="text" placeholder="ASN-XXXX-XXXX" class="w-full px-4 py-4 rounded-xl border-2 border-slate-200 focus:border-blue-500 outline-none text-center font-mono font-bold text-lg uppercase tracking-widest">
        </div>
        <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 shadow-lg transition">
          <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk Dashboard
        </button>
      </form>

      <div class="mt-6 text-center text-sm space-y-2">
        <p class="text-slate-500">Belum punya kode? <a href="registrasi.html" class="text-blue-600 font-bold">Daftar dulu</a></p>
        <p><a href="admin/index.html" class="text-slate-400 hover:text-blue-600"><i class="fa-solid fa-user-shield mr-1"></i> Login Admin</a></p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const kode = document.getElementById('kodeInput').value.trim().toUpperCase();
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Memeriksa...';

      // Di dalam event submit login, setelah data peserta didapat:
const deviceId = localStorage.getItem('device_id') || Math.random().toString(36).substring(2, 15);
localStorage.setItem('device_id', deviceId);

if (data.deviceId && data.deviceId !== deviceId) {
  throw new Error('Akun ini sedang digunakan di perangkat lain. Silakan logout dari perangkat tersebut.');
}

// Update peserta dengan deviceId saat ini
await db.collection('peserta').doc(kode).update({ deviceId: deviceId, lastLogin: new Date() });
      
      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        const doc = await db.collection('peserta').doc(kode).get();
        if (!doc.exists) throw new Error('Kode tidak ditemukan');
        const data = doc.data();
        if (!data.aktif) throw new Error('Kode sudah tidak aktif');
        if (data.expired && data.expired.toDate() < new Date()) throw new Error('Masa aktif kode sudah habis');

        KJ.setSession({ kode, ...data });
        KJ.toast('✅ Login berhasil!', 'success');
        setTimeout(() => location.href = 'dashboard.html', 800);
      } catch (err) {
        KJ.toast('❌ ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk Dashboard';
      }
    });
  </script>
</body>
</html>
