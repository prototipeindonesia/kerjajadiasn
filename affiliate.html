<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Mitra - Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <div class="bg-gradient-to-r from-indigo-600 to-blue-700 rounded-3xl p-8 text-white mb-8">
      <h1 class="text-3xl font-extrabold mb-2">Dashboard Mitra Affiliate</h1>
      <p>Pantau komisi dan performa referral Anda.</p>
    </div>
    
    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
        <p class="text-sm text-slate-500">Total Komisi</p>
        <p class="text-4xl font-black text-green-600" id="totalKomisi">Rp 0</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
        <p class="text-sm text-slate-500">Total Referral</p>
        <p class="text-4xl font-black text-blue-600" id="totalRef">0</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm">
      <h3 class="font-bold mb-4">Riwayat Referral</h3>
      <div id="refList" class="space-y-2"></div>
    </div>
  </div>
  <!-- Script Firebase & Logika load data affiliate di sini -->
</body>
</html>
