<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <a href="index.html" class="flex justify-center mb-6 text-2xl font-extrabold text-blue-600">
      KERJA JADI <span class="text-yellow-500">ASN</span>
    </a>
    <div class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-2 text-center">Daftar Sekarang</h1>
      <p class="text-slate-500 text-center mb-8 text-sm">Isi data diri Anda. Admin akan mengirimkan kode akses via WhatsApp.</p>

      <form id="formReg" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">Nama Lengkap</label>
          <input required name="nama" type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nama lengkap">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Nomor WhatsApp</label>
          <input required name="wa" type="tel" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="08123456789">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Email (opsional)</label>
          <input name="email" type="email" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="email@example.com">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Paket yang diinginkan</label>
          <select name="paket" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="1">Paket 1 - Standard (Rp 99.000)</option>
            <option value="2">Paket 2 - Sukses (Rp 149.000)</option>
            <option value="3">Paket 3 - Master (Rp 189.000)</option>
            <option value="gratis">Tryout Gratis</option>
          </select>
        </div>
        <button type="submit" id="btnReg" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 shadow-lg transition">
          <i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pendaftaran
        </button>
      </form>

      <p class="text-center text-slate-500 text-sm mt-6">
        Sudah punya kode? <a href="login.html" class="text-blue-600 font-bold">Masuk di sini</a>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    document.getElementById('formReg').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnReg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Mengirim...';

      try {
        // Anonymous auth untuk izin create
        if (!auth.currentUser) await auth.signInAnonymously();
        const fd = new FormData(e.target);
        const data = {
          nama: fd.get('nama').trim(),
          wa: fd.get('wa').trim(),
          email: (fd.get('email')||'').trim(),
          paket: fd.get('paket'),
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('pendaftar').add(data);
        KJ.toast('✅ Pendaftaran terkirim! Admin akan menghubungi Anda via WhatsApp.', 'success');
        e.target.reset();
        setTimeout(() => {
          const pesan = encodeURIComponent(`Halo Admin, saya ${data.nama} baru mendaftar di Kerja Jadi ASN dengan paket ${data.paket}. Mohon konfirmasi kode aksesnya.`);
          window.open(`https://wa.me/6285696409288?text=${pesan}`, '_blank');
        }, 1500);
      } catch (err) {
        console.error(err);
        KJ.toast('Gagal: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>Kirim Pendaftaran';
      }
    });
  </script>
</body>
</html>
