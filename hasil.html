<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Ujian — Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-slate-100 min-h-screen">

  <nav class="bg-white border-b shadow-sm sticky top-0 z-30">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="dashboard.html" class="text-blue-600 font-bold"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali</a>
      <span class="font-extrabold text-blue-600">KERJA JADI <span class="text-yellow-500">ASN</span></span>
      <div class="w-16"></div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div id="container" class="bg-white rounded-3xl p-6 md:p-8 shadow-xl">
      <div class="text-center py-8">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i>
        <p class="mt-4 text-slate-500">Memuat hasil...</p>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function jalankanConfetti() {
      if (typeof confetti !== 'function') return;
      const duration = 3000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
      const randomInRange = (min, max) => Math.random() * (max - min) + min;

      const interval = setInterval(() => {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        }));
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        }));
      }, 250);
    }

    function renderBadgeSubtes(isLulus) {
      return isLulus
        ? `<span class="inline-flex items-center gap-1 mt-2 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-green-100 text-green-700"><i class="fa-solid fa-circle-check"></i> Lulus</span>`
        : `<span class="inline-flex items-center gap-1 mt-2 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-100 text-red-700"><i class="fa-solid fa-circle-xmark"></i> Tidak Lulus</span>`;
    }

    function renderPembahasan(daftarSoal) {
      if (!Array.isArray(daftarSoal) || daftarSoal.length === 0) {
        return `
          <div class="mt-8 border-t pt-6">
            <div class="bg-slate-50 rounded-2xl p-6 text-center text-slate-500 text-sm">
              <i class="fa-solid fa-book-open text-2xl text-slate-400 mb-2"></i>
              <p>Data pembahasan soal tidak tersedia untuk sesi ujian ini.</p>
            </div>
          </div>
        `;
      }

      const itemsHTML = daftarSoal.map((item, idx) => {
        const kategori = escapeHTML(item.kategori || item.subtes || 'SOAL');
        const userJawab = (item.jawabanUser || '').toUpperCase();
        const kunci = (item.kunci || '').toUpperCase();
        const isTKP = kategori.toUpperCase() === 'TKP';

        let statusBadge = '';
        if (!userJawab) {
          statusBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-200 text-slate-700">Tidak Dijawab</span>`;
        } else if (isTKP) {
          const poin = Number(item.poin) || 0;
          statusBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-100 text-purple-700">Poin: +${poin}</span>`;
        } else if (userJawab === kunci) {
          statusBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-green-100 text-green-700"><i class="fa-solid fa-check mr-1"></i>Benar</span>`;
        } else {
          statusBadge = `<span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-red-100 text-red-700"><i class="fa-solid fa-xmark mr-1"></i>Salah</span>`;
        }

        const opsiHuruf = ['A', 'B', 'C', 'D', 'E'];
        const pilihanObj = item.pilihan || {};
        const pilihanHTML = opsiHuruf.map((huruf) => {
          const teksOpsi = pilihanObj[huruf] ?? pilihanObj[huruf.toLowerCase()];
          if (!teksOpsi) return '';

          const isKunci = huruf === kunci;
          const isPilihanUser = huruf === userJawab;

          let styleClass = 'border-slate-200 bg-white text-slate-700';
          let labelTambahan = '';

          if (isKunci) {
            styleClass = 'border-green-500 bg-green-50 text-green-900 font-semibold';
            labelTambahan = `<span class="ml-auto text-xs font-bold text-green-700"><i class="fa-solid fa-check-circle mr-1"></i>Kunci</span>`;
          } else if (isPilihanUser && !isTKP) {
            styleClass = 'border-red-400 bg-red-50 text-red-900';
            labelTambahan = `<span class="ml-auto text-xs font-bold text-red-600"><i class="fa-solid fa-xmark-circle mr-1"></i>Jawabanmu</span>`;
          } else if (isPilihanUser && isTKP) {
            styleClass = 'border-purple-400 bg-purple-50 text-purple-900 font-semibold';
            labelTambahan = `<span class="ml-auto text-xs font-bold text-purple-700">Jawabanmu</span>`;
          }

          return `
            <div class="flex items-start gap-3 p-3 rounded-xl border text-sm ${styleClass}">
              <span class="font-bold shrink-0">${huruf}.</span>
              <span>${escapeHTML(teksOpsi)}</span>
              ${labelTambahan}
            </div>
          `;
        }).join('');

        return `
          <div class="border border-slate-200 rounded-2xl p-5 mb-4 bg-white">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="bg-blue-600 text-white text-xs font-extrabold px-2.5 py-1 rounded-lg">No. ${idx + 1}</span>
                <span class="bg-slate-100 text-slate-700 text-xs font-bold px-2.5 py-1 rounded-lg">${kategori}</span>
              </div>
              ${statusBadge}
            </div>

            <p class="text-slate-800 text-sm md:text-base leading-relaxed mb-4 whitespace-pre-line">${escapeHTML(item.pertanyaan || item.soal || '')}</p>

            <div class="space-y-2 mb-4">
              ${pilihanHTML}
            </div>

            <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-4 text-sm text-slate-700">
              <div class="font-bold text-blue-800 mb-1"><i class="fa-solid fa-lightbulb mr-1.5 text-yellow-500"></i>Pembahasan:</div>
              <p class="leading-relaxed whitespace-pre-line">${escapeHTML(item.penjelasan || item.pembahasan || 'Tidak ada catatan pembahasan.')}</p>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="mt-8 border-t pt-6">
          <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
            <div>
              <h2 class="text-xl font-extrabold text-slate-800">Pembahasan Soal</h2>
              <p class="text-xs text-slate-500">Evaluasi jawaban dan pelajari kunci pembahasan tiap nomor</p>
            </div>
            <button id="togglePembahasanBtn" type="button" class="bg-blue-50 text-blue-700 hover:bg-blue-100 font-bold text-sm px-4 py-2 rounded-xl transition">
              <i class="fa-solid fa-eye-slash mr-1.5"></i>Sembunyikan Pembahasan
            </button>
          </div>
          <div id="listPembahasan">
            ${itemsHTML}
          </div>
        </div>
      `;
    }

    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        location.href = 'dashboard.html';
        return;
      }

      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        const doc = await db.collection('hasil').doc(id).get();
        if (!doc.exists) throw new Error('Hasil tidak ditemukan');

        const d = doc.data();

        const twk = Number(d.twk) || 0;
        const tiu = Number(d.tiu) || 0;
        const tkp = Number(d.tkp) || 0;
        const total = Number(d.total) || 0;

        // Cek kelulusan per subtes berdasarkan ambang batas SKD
        const lulusTWK = twk >= 65;
        const lulusTIU = tiu >= 80;
        const lulusTKP = tkp >= 166;
        const lulus = typeof d.lulus === 'boolean' ? d.lulus : (lulusTWK && lulusTIU && lulusTKP && total >= 311);

        const theme = lulus
          ? {
              badgeBg: 'bg-green-100',
              cardBg: 'bg-green-50',
              text: 'text-green-600',
              bar: 'bg-green-500',
              icon: 'fa-trophy',
              title: 'SELAMAT, LULUS!'
            }
          : {
              badgeBg: 'bg-red-100',
              cardBg: 'bg-red-50',
              text: 'text-red-600',
              bar: 'bg-red-500',
              icon: 'fa-face-sad-tear',
              title: 'BELUM LULUS'
            };

        const namaTryout = d.namaTryout || 'Tryout SKD CPNS';
        const waktu = Number(d.waktuPengerjaan) || 0;
        const mins = Math.floor(waktu / 60);
        const secs = waktu % 60;
        const persentase = Math.min(100, Math.max(0, (total / 550) * 100)).toFixed(1);

        // Susun pesan WhatsApp
        const pesanWA = [
          `*HASIL TRYOUT SKD — KERJA JADI ASN*`,
          `Paket: ${namaTryout}`,
          ``,
          `• TWK: *${twk}* / 150 (${lulusTWK ? 'Lulus' : 'Tidak Lulus'})`,
          `• TIU: *${tiu}* / 175 (${lulusTIU ? 'Lulus' : 'Tidak Lulus'})`,
          `• TKP: *${tkp}* / 225 (${lulusTKP ? 'Lulus' : 'Tidak Lulus'})`,
          `• Total Skor: *${total}* / 550`,
          ``,
          `Status: *${lulus ? 'LULUS AMBANG BATAS 🎉' : 'BELUM LULUS 💪'}*`
        ].join('\n');
        const waUrl = `https://wa.me/?text=${encodeURIComponent(pesanWA)}`;

        const daftarPembahasan = d.pembahasan || d.detailJawaban || [];

        document.getElementById('container').innerHTML = `
          <div class="text-center mb-8">
            <div class="w-24 h-24 ${theme.badgeBg} rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa-solid ${theme.icon} text-4xl ${theme.text}"></i>
            </div>
            <h1 class="text-3xl font-extrabold ${theme.text}">${theme.title}</h1>
            <p class="text-slate-500 mt-2">${escapeHTML(namaTryout)}</p>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-blue-50 rounded-2xl p-4 text-center flex flex-col items-center justify-between">
              <div class="text-xs font-bold text-slate-500 mb-1">TWK (PG ≥ 65)</div>
              <div class="text-2xl font-black text-blue-600">${twk}</div>
              <div class="text-xs text-slate-500">/ 150</div>
              ${renderBadgeSubtes(lulusTWK)}
            </div>
            <div class="bg-yellow-50 rounded-2xl p-4 text-center flex flex-col items-center justify-between">
              <div class="text-xs font-bold text-slate-500 mb-1">TIU (PG ≥ 80)</div>
              <div class="text-2xl font-black text-yellow-600">${tiu}</div>
              <div class="text-xs text-slate-500">/ 175</div>
              ${renderBadgeSubtes(lulusTIU)}
            </div>
            <div class="bg-purple-50 rounded-2xl p-4 text-center flex flex-col items-center justify-between">
              <div class="text-xs font-bold text-slate-500 mb-1">TKP (PG ≥ 166)</div>
              <div class="text-2xl font-black text-purple-600">${tkp}</div>
              <div class="text-xs text-slate-500">/ 225</div>
              ${renderBadgeSubtes(lulusTKP)}
            </div>
            <div class="${theme.cardBg} rounded-2xl p-4 text-center flex flex-col items-center justify-between">
              <div class="text-xs font-bold text-slate-500 mb-1">TOTAL</div>
              <div class="text-2xl font-black ${theme.text}">${total}</div>
              <div class="text-xs text-slate-500">/ 550</div>
              ${renderBadgeSubtes(lulus)}
            </div>
          </div>

          <div class="bg-slate-50 rounded-2xl p-6 mb-6">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
              <span class="font-bold">Nilai Ambang Batas</span>
              <span class="text-sm text-slate-500">TWK ≥ 65 · TIU ≥ 80 · TKP ≥ 166 · Total ≥ 311</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
              <div class="${theme.bar} h-full transition-all duration-500" style="width: ${persentase}%"></div>
            </div>
            <div class="text-right text-sm font-bold ${theme.text} mt-2">${persentase}%</div>
          </div>

          <div class="bg-slate-50 rounded-2xl p-4 text-sm text-slate-600 mb-6">
            <div class="flex justify-between"><span>Waktu Pengerjaan</span><strong>${mins} menit ${secs} detik</strong></div>
            <div class="flex justify-between mt-2"><span>Benar TWK</span><strong>${Number(d.benarTWK) || 0} soal</strong></div>
            <div class="flex justify-between mt-2"><span>Benar TIU</span><strong>${Number(d.benarTIU) || 0} soal</strong></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <a href="dashboard.html" class="bg-slate-100 text-slate-700 font-bold py-3 px-4 rounded-xl text-center hover:bg-slate-200 transition">
              Kembali
            </a>
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-center hover:bg-emerald-600 transition flex items-center justify-center gap-2">
              <i class="fa-brands fa-whatsapp text-lg"></i> Bagikan Hasil
            </a>
            <a href="tryout.html?id=${encodeURIComponent(d.tryoutId || '')}" class="bg-blue-600 text-white font-bold py-3 px-4 rounded-xl text-center hover:bg-blue-700 transition">
              Coba Lagi
            </a>
          </div>

          ${renderPembahasan(daftarPembahasan)}
        `;

        // Event listener tombol buka/tutup pembahasan
        const toggleBtn = document.getElementById('togglePembahasanBtn');
        const listPembahasan = document.getElementById('listPembahasan');
        if (toggleBtn && listPembahasan) {
          toggleBtn.addEventListener('click', () => {
            const isHidden = listPembahasan.classList.toggle('hidden');
            toggleBtn.innerHTML = isHidden
              ? '<i class="fa-solid fa-eye mr-1.5"></i>Tampilkan Pembahasan'
              : '<i class="fa-solid fa-eye-slash mr-1.5"></i>Sembunyikan Pembahasan';
          });
        }

        if (lulus) {
          jalankanConfetti();
        }
      } catch (e) {
        document.getElementById('container').innerHTML = `
          <div class="text-center text-red-600 py-8">
            <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
            <p class="font-bold">Terjadi Kesalahan</p>
            <p class="text-sm mt-1">${escapeHTML(e.message)}</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
