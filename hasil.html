<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Ujian — Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-slate-100 min-h-screen">

  <nav class="bg-white border-b shadow-sm sticky top-0 z-30">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="dashboard.html" class="text-blue-600 font-bold"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali</a>
      <span class="font-extrabold text-blue-600">KERJA JADI <span class="text-yellow-500">ASN</span></span>
      <div></div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div id="container" class="bg-white rounded-3xl p-8 shadow-xl">
      <div class="text-center py-8"><i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i><p class="mt-4 text-slate-500">Memuat hasil...</p></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { location.href = 'dashboard.html'; return; }
      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        const doc = await db.collection('hasil').doc(id).get();
        if (!doc.exists) throw new Error('Hasil tidak ditemukan');
        const d = doc.data();

        const color = d.lulus ? 'green' : 'red';
        const mins = Math.floor(d.waktuPengerjaan/60);
        const secs = d.waktuPengerjaan%60;

        document.getElementById('container').innerHTML = `
          <div class="text-center mb-8">
            <div class="w-24 h-24 bg-${color}-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa-solid ${d.lulus?'fa-trophy':'fa-face-sad-tear'} text-4xl text-${color}-600"></i>
            </div>
            <h1 class="text-3xl font-extrabold ${d.lulus?'text-green-600':'text-red-600'}">${d.lulus?'SELAMAT, LULUS!':'BELUM LULUS'}</h1>
            <p class="text-slate-500 mt-2">${d.namaTryout}</p>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-blue-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TWK</div>
              <div class="text-2xl font-black text-blue-600">${d.twk}</div>
              <div class="text-xs text-slate-500">/ 150</div>
            </div>
            <div class="bg-yellow-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TIU</div>
              <div class="text-2xl font-black text-yellow-600">${d.tiu}</div>
              <div class="text-xs text-slate-500">/ 175</div>
            </div>
            <div class="bg-purple-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TKP</div>
              <div class="text-2xl font-black text-purple-600">${d.tkp}</div>
              <div class="text-xs text-slate-500">/ 225</div>
            </div>
            <div class="bg-${color}-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TOTAL</div>
              <div class="text-2xl font-black text-${color}-600">${d.total}</div>
              <div class="text-xs text-slate-500">/ 550</div>
            </div>
          </div>

          <div class="bg-slate-50 rounded-2xl p-6 mb-6">
            <div class="flex justify-between items-center mb-3">
              <span class="font-bold">Nilai Ambang Batas</span>
              <span class="text-sm text-slate-500">TWK ≥ 65 · TIU ≥ 80 · TKP ≥ 166 · Total ≥ 311</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
              <div class="bg-${color}-500 h-full" style="width: ${(d.total/550*100).toFixed(1)}%"></div>
            </div>
            <div class="text-right text-sm font-bold text-${color}-600 mt-2">${(d.total/550*100).toFixed(1)}%</div>
          </div>

          <div class="bg-slate-50 rounded-2xl p-4 text-sm text-slate-600 mb-6">
            <div class="flex justify-between"><span>Waktu Pengerjaan</span><strong>${mins} menit ${secs} detik</strong></div>
            <div class="flex justify-between mt-2"><span>Benar TWK</span><strong>${d.benarTWK} soal</strong></div>
            <div class="flex justify-between mt-2"><span>Benar TIU</span><strong>${d.benarTIU} soal</strong></div>
          </div>

          <div class="flex gap-3">
            <a href="dashboard.html" class="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl text-center hover:bg-slate-200">Kembali</a>
            <a href="tryout.html?id=${d.tryoutId}" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl text-center hover:bg-blue-700">Coba Lagi</a>
          </div>
        `;
      } catch (e) {
        document.getElementById('container').innerHTML = `<div class="text-center text-red-600 py-8">Error: ${e.message}</div>`;
      }
    })();
  </script>
</body>
</html>
