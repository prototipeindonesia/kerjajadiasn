<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Ujian — Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-slate-100 min-h-screen">

  <nav class="bg-white border-b shadow-sm sticky top-0 z-30">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="dashboard.html" class="text-blue-600 font-bold"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali</a>
      <span class="font-extrabold text-blue-600">KERJA JADI <span class="text-yellow-500">ASN</span></span>
      <div class="w-16"></div>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8 max-w-4xl">
    <div id="container" class="bg-white rounded-3xl p-8 shadow-xl">
      <div class="text-center py-8">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i>
        <p class="mt-4 text-slate-500">Memuat hasil...</p>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    function escapeHTML(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function jalankanConfetti() {
      if (typeof confetti !== 'function') return;
      const duration = 3000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
      const randomInRange = (min, max) => Math.random() * (max - min) + min;

      const interval = setInterval(() => {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        }));
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        }));
      }, 250);
    }

    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        location.href = 'dashboard.html';
        return;
      }

      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        const doc = await db.collection('hasil').doc(id).get();
        if (!doc.exists) throw new Error('Hasil tidak ditemukan');

        const d = doc.data();
        const lulus = Boolean(d.lulus);

        // Gunakan nama class Tailwind secara utuh agar terbaca oleh Tailwind CDN
        const theme = lulus
          ? {
              badgeBg: 'bg-green-100',
              cardBg: 'bg-green-50',
              text: 'text-green-600',
              bar: 'bg-green-500',
              icon: 'fa-trophy',
              title: 'SELAMAT, LULUS!'
            }
          : {
              badgeBg: 'bg-red-100',
              cardBg: 'bg-red-50',
              text: 'text-red-600',
              bar: 'bg-red-500',
              icon: 'fa-face-sad-tear',
              title: 'BELUM LULUS'
            };

        const waktu = Number(d.waktuPengerjaan) || 0;
        const mins = Math.floor(waktu / 60);
        const secs = waktu % 60;

        const twk = Number(d.twk) || 0;
        const tiu = Number(d.tiu) || 0;
        const tkp = Number(d.tkp) || 0;
        const total = Number(d.total) || 0;
        const persentase = Math.min(100, Math.max(0, (total / 550) * 100)).toFixed(1);

        document.getElementById('container').innerHTML = `
          <div class="text-center mb-8">
            <div class="w-24 h-24 ${theme.badgeBg} rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa-solid ${theme.icon} text-4xl ${theme.text}"></i>
            </div>
            <h1 class="text-3xl font-extrabold ${theme.text}">${theme.title}</h1>
            <p class="text-slate-500 mt-2">${escapeHTML(d.namaTryout || 'Tryout SKD CPNS')}</p>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-blue-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TWK</div>
              <div class="text-2xl font-black text-blue-600">${twk}</div>
              <div class="text-xs text-slate-500">/ 150</div>
            </div>
            <div class="bg-yellow-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TIU</div>
              <div class="text-2xl font-black text-yellow-600">${tiu}</div>
              <div class="text-xs text-slate-500">/ 175</div>
            </div>
            <div class="bg-purple-50 rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TKP</div>
              <div class="text-2xl font-black text-purple-600">${tkp}</div>
              <div class="text-xs text-slate-500">/ 225</div>
            </div>
            <div class="${theme.cardBg} rounded-2xl p-4 text-center">
              <div class="text-xs font-bold text-slate-500 mb-1">TOTAL</div>
              <div class="text-2xl font-black ${theme.text}">${total}</div>
              <div class="text-xs text-slate-500">/ 550</div>
            </div>
          </div>

          <div class="bg-slate-50 rounded-2xl p-6 mb-6">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
              <span class="font-bold">Nilai Ambang Batas</span>
              <span class="text-sm text-slate-500">TWK ≥ 65 · TIU ≥ 80 · TKP ≥ 166 · Total ≥ 311</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
              <div class="${theme.bar} h-full transition-all duration-500" style="width: ${persentase}%"></div>
            </div>
            <div class="text-right text-sm font-bold ${theme.text} mt-2">${persentase}%</div>
          </div>

          <div class="bg-slate-50 rounded-2xl p-4 text-sm text-slate-600 mb-6">
            <div class="flex justify-between"><span>Waktu Pengerjaan</span><strong>${mins} menit ${secs} detik</strong></div>
            <div class="flex justify-between mt-2"><span>Benar TWK</span><strong>${Number(d.benarTWK) || 0} soal</strong></div>
            <div class="flex justify-between mt-2"><span>Benar TIU</span><strong>${Number(d.benarTIU) || 0} soal</strong></div>
          </div>

          <div class="flex gap-3">
            <a href="dashboard.html" class="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl text-center hover:bg-slate-200">Kembali</a>
            <a href="tryout.html?id=${encodeURIComponent(d.tryoutId || '')}" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl text-center hover:bg-blue-700">Coba Lagi</a>
          </div>
        `;

        // Jalankan confetti di dalam blok async setelah UI dirender
        if (lulus) {
          jalankanConfetti();
        }
      } catch (e) {
        document.getElementById('container').innerHTML = `
          <div class="text-center text-red-600 py-8">
            <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
            <p class="font-bold">Terjadi Kesalahan</p>
            <p class="text-sm mt-1">${escapeHTML(e.message)}</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
