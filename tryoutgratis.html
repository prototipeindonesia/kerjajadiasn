<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tryout Gratis Sabtu — Kerja Jadi ASN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-50 min-h-screen">

  <nav class="bg-white/90 backdrop-blur shadow-sm sticky top-0 z-30">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2 text-blue-600 font-extrabold">KERJA JADI <span class="text-yellow-500">ASN</span></a>
      <a href="login.html" class="text-blue-600 font-bold text-sm">Masuk</a>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-12 max-w-2xl">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 bg-green-100 text-green-700 px-4 py-2 rounded-full font-bold text-sm mb-4">
        <i class="fa-solid fa-gift"></i> GRATIS SETIAP SABTU
      </div>
      <h1 class="text-4xl font-extrabold mb-3">Tryout Gratis SKD</h1>
      <p class="text-slate-600">Latihan soal SKD lengkap 110 soal, gratis tanpa biaya setiap hari Sabtu.</p>
    </div>

    <div id="statusBox" class="bg-white rounded-2xl p-8 shadow-xl mb-6">
      <div class="text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-green-600"></i><p class="mt-3 text-slate-500">Memeriksa jadwal...</p></div>
    </div>

    <div id="formBox" class="bg-white rounded-2xl p-8 shadow-xl hidden">
      <h2 class="text-xl font-bold mb-4"><i class="fa-solid fa-play-circle text-green-600 mr-2"></i>Mulai Tryout Gratis</h2>
      <form id="formGratis" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1">Nama Lengkap</label>
          <input required name="nama" class="w-full px-4 py-3 rounded-xl border outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">Nomor WhatsApp</label>
          <input required name="wa" type="tel" class="w-full px-4 py-3 rounded-xl border outline-none focus:ring-2 focus:ring-green-500" placeholder="0812...">
        </div>
        <button type="submit" id="btnStart" class="w-full bg-green-600 text-white font-extrabold py-4 rounded-2xl hover:bg-green-700 shadow-lg">
          <i class="fa-solid fa-bolt mr-2"></i> Mulai Tryout Sekarang
        </button>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    async function checkDay() {
      if (KJ.isSaturday()) {
        document.getElementById('statusBox').classList.add('hidden');
        document.getElementById('formBox').classList.remove('hidden');
      } else {
        const now = new Date();
        const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
        const daysUntilSat = (6 - now.getDay() + 7) % 7 || 7;
        const nextSat = new Date(now);
        nextSat.setDate(now.getDate() + daysUntilSat);

        document.getElementById('statusBox').innerHTML = `
          <div class="text-center">
            <i class="fa-solid fa-calendar-xmark text-5xl text-slate-300 mb-4"></i>
            <h3 class="text-xl font-bold mb-2">Tryout Gratis Hanya Hari Sabtu</h3>
            <p class="text-slate-600 mb-4">Hari ini ${days[now.getDay()]}. Tryout gratis dibuka kembali pada:</p>
            <div class="bg-green-50 rounded-xl p-4 inline-block">
              <div class="text-sm text-green-700 font-bold">Sabtu, ${nextSat.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>
            </div>
            <div class="mt-6">
              <a href="registrasi.html" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold inline-block hover:bg-blue-700">Daftar Paket Premium</a>
            </div>
          </div>`;
      }
    }

    document.getElementById('formGratis').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnStart');
      btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyiapkan...';

      try {
        if (!auth.currentUser) await auth.signInAnonymously();
        const fd = new FormData(e.target);
        const kodeGratis = 'GRATIS-' + Date.now().toString(36).toUpperCase();

        // Simpan sebagai peserta sementara
        await db.collection('peserta').doc(kodeGratis).set({
          kode: kodeGratis,
          nama: fd.get('nama').trim(),
          wa: fd.get('wa').trim(),
          paket: 'gratis',
          aktif: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        KJ.setSession({ kode: kodeGratis, nama: fd.get('nama').trim(), paket: 'gratis' });

        // Cari tryout gratis
        const snap = await db.collection('tryout').where('tipe', '==', 'gratis').where('aktif', '==', true).limit(1).get();
        if (snap.empty) {
          KJ.toast('Tryout gratis belum disiapkan. Hubungi admin.', 'warning');
          return;
        }
        const tryoutId = snap.docs[0].id;
        location.href = `tryout.html?id=${tryoutId}`;
      } catch (err) {
        KJ.toast('Error: ' + err.message, 'error');
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt mr-2"></i> Mulai Tryout Sekarang';
      }
    });

    checkDay();
  </script>
</body>
</html>
